<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dimuthu Muthu Caters — POS</title>
<style>
:root{
  --primary:#16324f; --primary2:#1d4368; --accent:#e07b39; --accent2:#c9662a;
  --bg:#f4f6f9; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
  --green:#2a9d8f; --red:#e63946; --amber:#f4a261; --border:#e5e7eb;
  --radius:12px; --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.06);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
body{background:var(--bg);color:var(--text);font-size:14px}
button{cursor:pointer;border:none;border-radius:8px;font-size:14px;transition:.15s}
input,select,textarea{border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:14px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent)40;border-color:var(--accent)}
label{font-size:12px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.btn{background:var(--primary);color:#fff;padding:10px 16px;font-weight:600}
.btn:hover{background:var(--primary2)}
.btn-accent{background:var(--accent);color:#fff;padding:10px 16px;font-weight:600}
.btn-accent:hover{background:var(--accent2)}
.btn-green{background:var(--green);color:#fff;padding:10px 16px;font-weight:600}
.btn-red{background:var(--red);color:#fff;padding:8px 12px;font-weight:600}
.btn-ghost{background:#eef1f5;color:var(--text);padding:9px 14px}
.btn-ghost:hover{background:#e2e7ee}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- LOGIN ---------- */
#login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#16324f 0%,#1d4368 55%,#2a5780 100%);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
.login-card{background:#fff;border-radius:20px;padding:38px;width:100%;max-width:440px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.login-logo{text-align:center;margin-bottom:26px}
.login-logo .mark{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--accent),var(--amber));display:inline-flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:12px}
.login-logo h1{font-size:22px;color:var(--primary)}
.login-logo p{color:var(--muted);font-size:13px}
.counter-pick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:6px}
.counter-pick button{padding:12px 0;border:2px solid var(--border);background:#fff;font-weight:700;border-radius:10px}
.counter-pick button.sel{border-color:var(--accent);background:#fdf1e7;color:var(--accent2)}

/* ---------- LAYOUT ---------- */
#app{display:none}
#sidebar{position:fixed;left:0;top:0;bottom:0;width:212px;background:var(--primary);color:#fff;z-index:50;display:flex;flex-direction:column}
#sidebar .brand{padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
#sidebar .brand h2{font-size:15px;line-height:1.3}
#sidebar .brand small{color:#9db4cd;font-size:11px}
.nav-item{display:flex;align-items:center;gap:12px;padding:13px 18px;color:#c6d4e3;font-weight:500;cursor:pointer;border-left:3px solid transparent}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:rgba(255,255,255,.1);color:#fff;border-left-color:var(--accent)}
.nav-item .ico{font-size:18px;width:22px;text-align:center}
#sidebar .foot{margin-top:auto;padding:14px 16px;border-top:1px solid rgba(255,255,255,.12);font-size:12px;color:#9db4cd}
#main{margin-left:212px;min-height:100vh;padding:22px 26px 90px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.page-head h2{font-size:21px;color:var(--primary)}
.page-head .sub{color:var(--muted);font-size:13px;margin-top:2px}

/* ---------- CARDS / GRIDS ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.grid{display:grid;gap:16px}
.stat-card{padding:18px}
.stat-card .lbl{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.stat-card .val{font-size:26px;font-weight:800;color:var(--primary);margin-top:6px}
.stat-card .delta{font-size:12px;margin-top:4px;color:var(--green)}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.b-blue{background:#dbeafe;color:#1d4ed8}.b-green{background:#d1fae5;color:#047857}
.b-amber{background:#fef3c7;color:#b45309}.b-red{background:#fee2e2;color:#b91c1c}
.b-gray{background:#e5e7eb;color:#4b5563}.b-purple{background:#ede9fe;color:#6d28d9}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--border)}
td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
.tbl-wrap{overflow-x:auto}

/* ---------- POS ---------- */
.pos-wrap{display:grid;grid-template-columns:1fr 390px;gap:16px;height:calc(100vh - 130px)}
.pos-left{display:flex;flex-direction:column;gap:12px;min-width:0}
.cat-tabs{display:flex;gap:8px;flex-wrap:wrap}
.cat-tab{padding:9px 16px;background:#fff;border:2px solid var(--border);border-radius:20px;font-weight:600;font-size:13px}
.cat-tab.active{border-color:var(--accent);background:#fdf1e7;color:var(--accent2)}
.prod-grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;align-content:start;padding-right:4px}
.prod-btn{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px 10px;text-align:center;box-shadow:var(--shadow);min-height:92px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.prod-btn:hover{border-color:var(--accent);transform:translateY(-2px)}
.prod-btn .nm{font-weight:700;font-size:13px;line-height:1.25}
.prod-btn .pr{color:var(--accent2);font-weight:800;font-size:14px}
.cart{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.cart-head{padding:14px 16px;background:var(--primary);color:#fff}
.cart-head .row{display:flex;gap:6px;margin-top:10px}
.ot-btn{flex:1;padding:8px 0;background:rgba(255,255,255,.14);color:#fff;font-weight:600;font-size:12px;border-radius:8px}
.ot-btn.active{background:var(--accent)}
.cart-items{flex:1;overflow-y:auto;padding:8px 12px;min-height:120px}
.cart-line{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px dashed var(--border)}
.cart-line .nm{flex:1;font-weight:600;font-size:13px}
.cart-line .pr{font-weight:700;font-size:13px;min-width:74px;text-align:right}
.qty-ctl{display:flex;align-items:center;gap:4px}
.qty-ctl button{width:26px;height:26px;background:#eef1f5;border-radius:6px;font-weight:800;font-size:15px;line-height:1}
.qty-ctl .q{min-width:26px;text-align:center;font-weight:700}
.cart-foot{padding:12px 16px;border-top:2px solid var(--border);background:#fafbfd}
.cart-foot .ln{display:flex;justify-content:space-between;padding:3px 0;font-size:13px}
.cart-foot .ln.total{font-size:19px;font-weight:800;color:var(--primary);border-top:2px solid var(--border);margin-top:6px;padding-top:8px}
.cart-actions{display:flex;gap:8px;margin-top:12px}
.cart-actions button{flex:1;padding:12px 0;font-size:14px}

/* ---------- MODAL / TOAST ---------- */
#modal-root{position:fixed;inset:0;background:rgba(15,30,45,.55);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
#modal-root.show{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff}
.modal-head h3{font-size:16px;color:var(--primary)}
.modal-body{padding:20px}
.modal-x{background:#eef1f5;width:30px;height:30px;border-radius:8px;font-size:16px;font-weight:700}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--primary);color:#fff;padding:12px 22px;border-radius:12px;font-weight:600;z-index:300;transition:.3s;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--red)}

/* ---------- CALENDAR ---------- */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{text-align:center;font-size:11px;font-weight:800;color:var(--muted);padding:6px 0;text-transform:uppercase}
.cal-day{background:#fff;border:1px solid var(--border);border-radius:10px;min-height:86px;padding:6px;font-size:12px}
.cal-day.dim{background:#fafafa;color:#c3c9d3}
.cal-day.today{border:2px solid var(--accent)}
.cal-day .dnum{font-weight:800;font-size:13px}
.cal-ev{background:#eaf3fb;border-left:3px solid var(--primary);border-radius:5px;padding:2px 5px;margin-top:4px;font-size:10.5px;font-weight:600;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cal-ev.st1{border-left-color:var(--amber);background:#fdf6ec}
.cal-ev.st2{border-left-color:var(--green);background:#eaf7f5}
.cal-ev.st5{border-left-color:#9b5de5;background:#f4effc}

/* ---------- KITCHEN ---------- */
.kt-cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.kt-ticket{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;border-top:4px solid var(--amber)}
.kt-ticket.ready{border-top-color:var(--green)}
.kt-ticket.done{border-top-color:#9ca3af;opacity:.65}
.kt-ticket h4{font-size:14px;color:var(--primary)}
.kt-items{margin:10px 0;padding:8px 0;border-top:1px dashed var(--border);border-bottom:1px dashed var(--border)}
.kt-items div{padding:3px 0;font-size:13px;display:flex;justify-content:space-between}

/* ---------- STATUS PILL STEPS ---------- */
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{padding:6px 14px;border-radius:20px;background:#eef1f5;font-size:12px;font-weight:700;color:var(--muted)}
.step.done{background:var(--green);color:#fff}
.step.cur{background:var(--accent);color:#fff}

/* ---------- MOBILE ---------- */
#mob-nav{display:none}
@media(max-width:980px){
  #sidebar{display:none}
  #main{margin-left:0;padding:14px 12px 96px}
  .pos-wrap{grid-template-columns:1fr;height:auto}
  .cart{position:sticky;bottom:70px}
  .prod-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
  #mob-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--primary);z-index:60;justify-content:space-around;padding:6px 0 max(6px,env(safe-area-inset-bottom))}
  #mob-nav .nav-item{flex-direction:column;gap:2px;padding:6px 8px;border:none;font-size:10px;color:#c6d4e3}
  #mob-nav .nav-item.active{background:none;color:var(--accent)}
}
/* ---------- PRINT ---------- */
#print-area{display:none}
@media print{
  body>*{display:none !important}
  #print-area{display:block !important;font-family:'Courier New',monospace;width:76mm;margin:0 auto;color:#000;font-size:12px}
  #print-area.a4{width:190mm;font-family:'Segoe UI',sans-serif;font-size:13px}
}
@media print and (min-width:100px){ #print-area.a4{page-break-inside:auto} }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <div class="mark">🍛</div>
      <h1>Dimuthu Muthu Caters</h1>
      <p>Point of Sale System · Sri Lanka</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div><label>Your Name</label><input id="login-name" placeholder="e.g. Dimuthu" value="Dimuthu"></div>
      <div><label>Role</label>
        <select id="login-role">
          <option selected>Owner / Admin</option><option>Manager</option><option>Cashier</option>
          <option>Catering Coordinator</option><option>Kitchen Staff</option><option>Storekeeper</option>
        </select>
      </div>
      <div>
        <label>Select Counter (1–5)</label>
        <div class="counter-pick" id="counter-pick"></div>
      </div>
      <button class="btn-accent" style="padding:13px;font-size:15px" onclick="doLogin()">Sign In to POS</button>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <div id="sidebar">
    <div class="brand"><h2>🍛 Dimuthu Muthu<br>Caters</h2><small id="brand-sub">POS · Sri Lanka</small></div>
    <div id="nav-desk"></div>
    <div class="foot"><div id="whoami"></div><br><a style="color:#f4a261;cursor:pointer" onclick="logout()">Sign out</a></div>
  </div>
  <div id="mob-nav"></div>
  <div id="main"><div id="screen"></div></div>
</div>

<div id="modal-root"><div class="modal" id="modal-box"></div></div>
<div id="toast"></div>
<div id="print-area"></div>

<script>
/* =====================================================
   DIMUTHU MUTHU CATERERS — POS PROTOTYPE
   Data persists in browser localStorage (demo mode).
   ===================================================== */
const $=s=>document.querySelector(s);
const fmt=n=>'Rs. '+(Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=n=>(Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowISO=()=>new Date().toISOString();
const todayISO=()=>new Date().toISOString().slice(0,10);
const dISO=d=>{const t=new Date(d);return t.toLocaleDateString('en-GB');};
const tISO=d=>{const t=new Date(d);return t.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});};
const dAdd=(iso,n)=>{const d=new Date(iso);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);};

/* ---------- SEED DATA ---------- */
function seed(){
  const P=(id,name,cat,price,type,unit,extra={})=>({id,name,cat,price,type,unit,...extra});
  return {
    business:{name:'Dimuthu Muthu Caters',address:'No. 42, Kandy Road, Kadawatha',phone:'011 234 5678',
      email:'orders@dimuthumuthu.lk',tin:'',vatRegistered:false,serviceChargePct:10,
      payhere:{merchantId:'',secret:'',enabled:true},
      methods:{cash:true,card:true,bank:true,payhere:true},counters:5},
    products:[
      P('p1','Egg Roll','Short Eats',120,'counter','each',{stock:40,minStock:10}),
      P('p2','Fish Patty','Short Eats',150,'counter','each',{stock:30,minStock:10}),
      P('p3','Chicken Samosa','Short Eats',130,'counter','each',{stock:25,minStock:10}),
      P('p4','Vegetarian Roll','Short Eats',100,'counter','each',{stock:35,minStock:10}),
      P('p5','Beef Bun','Bakery',140,'counter','each',{stock:20,minStock:8}),
      P('p6','Butter Cake Slice','Bakery',180,'counter','each',{stock:15,minStock:6}),
      P('p7','Plain Tea','Beverages',60,'counter','each',{stock:999}),
      P('p8','Milk Tea','Beverages',120,'counter','each',{stock:999}),
      P('p9','Coffee','Beverages',180,'counter','each',{stock:999}),
      P('p10','Soft Drink','Beverages',150,'counter','each',{stock:48,minStock:12}),
      P('p11','Water Bottle','Beverages',80,'counter','each',{stock:60,minStock:20}),
      P('p12','Fresh Juice','Beverages',250,'counter','each',{stock:999}),
      P('p13','Ice Cream Cup','Ice Cream',300,'counter','each',{stock:25,minStock:10}),
      P('c1','Rice & Curry Buffet','Main Menu',1500,'catering','per plate',{recipe:true}),
      P('c2','Chicken Biryani','Main Menu',1200,'catering','per plate',{recipe:true}),
      P('c3','Vegetable Fried Rice','Main Menu',1000,'catering','per plate',{recipe:true}),
      P('c4','Kottu Roti','Main Menu',900,'catering','per plate',{recipe:true}),
      P('c5','String Hopper Menu','Main Menu',800,'catering','per plate',{recipe:true}),
      P('c6','Hopper Menu','Main Menu',900,'catering','per plate',{recipe:true}),
      P('c7','Pittu Menu','Main Menu',850,'catering','per plate'),
      P('c8','Seafood Platter','Main Menu',2500,'catering','per plate'),
      P('c9','Dessert Buffet','Desserts',500,'catering','per plate',{recipe:true}),
      P('c10','Watalappan','Desserts',250,'catering','per plate'),
      P('c11','Fruit Salad','Desserts',200,'catering','per plate'),
      P('c12','Live Tea/Coffee Station','Desserts',350,'catering','per plate'),
      P('x1','Delivery (within 30km)','Extras',5000,'extra','each'),
      P('x2','Service Staff (per person)','Extras',2500,'extra','each'),
      P('x3','Chafing Dish Rental','Extras',1500,'extra','each'),
      P('x4','Table & Chair Set (10 pax)','Extras',5000,'extra','each'),
      P('x5','Basic Decoration','Extras',10000,'extra','each'),
    ],
    inventory:[
      {id:'i1',name:'Rice (Samba)',unit:'kg',stock:120,cost:220,minStock:50},
      {id:'i2',name:'Chicken',unit:'kg',stock:40,cost:1350,minStock:20},
      {id:'i3',name:'Vegetables (mix)',unit:'kg',stock:30,cost:320,minStock:15},
      {id:'i4',name:'Eggs',unit:'pcs',stock:300,cost:28,minStock:100},
      {id:'i5',name:'Wheat Flour',unit:'kg',stock:50,cost:260,minStock:20},
      {id:'i6',name:'Coconut Milk',unit:'L',stock:20,cost:480,minStock:10},
      {id:'i7',name:'Cooking Oil',unit:'L',stock:25,cost:890,minStock:10},
      {id:'i8',name:'Milk Powder',unit:'kg',stock:12,cost:3400,minStock:5},
      {id:'i9',name:'Sugar',unit:'kg',stock:30,cost:245,minStock:10},
      {id:'i10',name:'Spice Mix',unit:'kg',stock:8,cost:1800,minStock:3},
      {id:'i11',name:'String Hopper Flour',unit:'kg',stock:15,cost:300,minStock:8},
      {id:'i12',name:'Kithul Treacle',unit:'L',stock:6,cost:1500,minStock:2},
    ],
    recipes:{
      c1:[['i1',.30],['i2',.20],['i3',.25],['i10',.02],['i6',.05]],
      c2:[['i1',.25],['i2',.18],['i10',.03],['i7',.03],['i3',.10]],
      c3:[['i1',.25],['i3',.20],['i7',.03],['i10',.02]],
      c4:[['i5',.15],['i2',.12],['i3',.10],['i10',.02]],
      c5:[['i11',.20],['i6',.05],['i3',.15]],
      c6:[['i1',.15],['i6',.08],['i4',1]],
      c9:[['i8',.03],['i9',.05],['i12',.02]],
    },
    customers:[
      {id:'cu1',name:'Nimal Perera',phone:'077 123 4567',email:'nimal@gmail.com',address:'Colombo 07',notes:'Prefers less spicy'},
      {id:'cu2',name:'Kumari Silva',phone:'071 987 6543',email:'',address:'Negombo',notes:''},
      {id:'cu3',name:'Dialog Technologies (Pvt) Ltd',phone:'011 456 7890',email:'events@dialog.lk',address:'Colombo 03',notes:'Corporate account'},
    ],
    counterOrders:[],heldOrders:[],cateringOrders:[],
    seq:{counter:1000,catering:500},
    moves:[],
  };
}

/* ---------- STATE ---------- */
let S=JSON.parse(localStorage.getItem('dmc_pos')||'null');
if(!S){S=seed();seedOrders();save();}
else if(S.session){
  window.addEventListener('DOMContentLoaded', () => {
    refreshLoginCounters();
    $('#login-screen').style.display='none';
    $('#app').style.display='block';
    $('#whoami').innerHTML='👤 '+esc(S.session.name)+'<br><small>'+esc(S.session.role)+' · Counter '+S.session.counter+'</small>';
    $('#brand-sub').textContent=isAdmin()?'ADMIN · FULL ACCESS · LKR':'Counter '+S.session.counter+' · LKR';
    buildNav();go('dashboard');
  });
}
function save(){localStorage.setItem('dmc_pos',JSON.stringify(S));}

function seedOrders(){
  const mk=(mins,items,type,pay)=>{const d=new Date(Date.now()-mins*60000);
    const its=items.map(([pid,q])=>{const p=S.products.find(x=>x.id===pid);return{id:pid,name:p.name,price:p.price,qty:q};});
    const sub=its.reduce((a,i)=>a+i.price*i.qty,0);
    return {id:uid(),no:'C'+(++S.seq.counter),counter:1+Math.floor(Math.random()*5),cashier:'Kasun',
      type,items:its,subtotal:sub,discount:0,svc:0,total:sub,payments:[{method:pay,amount:sub}],
      change:0,status:'done',createdAt:d.toISOString()};};
  S.counterOrders=[
    mk(300,[['p1',2],['p8',2]],'Takeaway','cash'),
    mk(240,[['p2',1],['p10',1],['p13',1]],'Dine-in','card'),
    mk(90,[['p3',3],['p8',3]],'Takeaway','cash'),
    mk(30,[['p6',2],['p9',2]],'Dine-in','cash'),
  ];
  const ev=(title,days,cust,guests,lines,status,paid)=>{
    const date=dAdd(todayISO(),days);
    const ls=lines.map(([pid,perPlate,qty])=>{const p=S.products.find(x=>x.id===pid);
      return{id:pid,name:p.name,unit:p.unit,rate:p.price,qty,perPlate};});
    const sub=ls.reduce((a,l)=>a+l.rate*(l.perPlate?guests:l.qty),0);

/* ---------- ROLE ACCESS ----------
   Owner / Admin has unrestricted access to every POS module.
   Other roles only see modules relevant to their job. */
const ROLE_ACCESS={
  'Owner / Admin':NAV.map(x=>x[0]),
  'Manager':['dashboard','pos','catering','calendar','kitchen','inventory','customers','reports','settings'],
  'Cashier':['dashboard','pos'],
  'Catering Coordinator':['dashboard','catering','calendar','customers'],
  'Kitchen Staff':['dashboard','kitchen'],
  'Storekeeper':['dashboard','inventory']
};
function isAdmin(){return S.session && S.session.role==='Owner / Admin';}
function canAccess(screen){
  if(isAdmin()) return true;
  const allowed=ROLE_ACCESS[S.session?.role]||['dashboard'];
  return allowed.includes(screen);
}
function buildNav(){
  const allowed=NAV.filter(([k])=>canAccess(k));
  const make=(k,i,l)=>'<div class="nav-item'+(UI.screen===k?' active':'')+'" onclick="go(\''+k+'\')"><span class="ico">'+i+'</span>'+l+'</div>';
  $('#nav-desk').innerHTML=allowed.map(([k,i,l])=>make(k,i,l)).join('');
  $('#mob-nav').innerHTML=allowed.map(([k,i,l])=>make(k,i,l)).join('');
}
function go(s,arg){
  if(!canAccess(s)){

  const sub=cart.items.reduce((a,i)=>a+i.price*i.qty,0);

  const base=sub-disc;
  const svc=cart.svcOn?base*(S.business.serviceChargePct||0)/100:0;
  return{sub,disc,svc,total:base+svc};
}

function addToCart(id){const p=S.products.find(x=>x.id===id);

  const ex=cart.items.find(i=>i.id===id);if(ex)ex.qty++;else cart.items.push({id,qty:1,name:p.name,price:p.price});
  renderPOSGrid();renderCartFoot();}
function chQty(ix,d){cart.items[ix].qty+=d;if(cart.items[ix].qty<=0)cart.items.splice(ix,1);renderPOSGrid();renderCartFoot();}

function openPayModal(){
  const c=cartCalc();
  openModal(`<h3>Payment — ${fmt(c.total)}</h3>
  <div style="display:flex;flex-direction:column;gap:12px">
  ${[['cash','💵 Cash'],['card','💳 Card Terminal'],['bank','🏦 Bank Transfer'],['payhere','🌐 PayHere Online']].map(([m,l])=>S.business.methods[m]?`
    <div><label>${l}</label><input type="number" min="0" step="0.01" id="pay_${m}" placeholder="0.00" oninput="payCalc(${c.total})"></div>`:'').join('')}
  <div class="card" style="box-shadow:none;background:#fafbfd;display:flex;justify-content:space-between"><span>Paid</span><b id="pay-sum">Rs. 0.00</b></div>
  <div class="card" style="box-shadow:none;background:#fafbfd;display:flex;justify-content:space-between"><span>Balance / Change</span><b id="pay-rem" style="color:var(--red)">Rs. ${num(c.total)}</b></div>
  <button class="btn-green" style="padding:14px;font-size:16px" id="pay-done" disabled onclick="completeSale()">COMPLETE SALE ✔</button>
  </div>`);mTitle('Take Payment · '+cart.type);
}
function payCalc(total){
  const m=['cash','card','bank','payhere'];let sum=0;
  m.forEach(x=>{const el=$('#pay_'+x);if(el)sum+=parseFloat(el.value)||0;});
  const rem=sum-total;
  $('#pay-sum').textContent=fmt(sum);
  $('#pay-rem').textContent=(rem>=0?'Change: ':'Remaining: ')+fmt(Math.abs(rem));
  $('#pay-rem').style.color=rem>=0?'var(--green)':'var(--red)';
  $('#pay-done').disabled=sum+0.001<total;
}
function completeSale(){
  const c=cartCalc();
  const payments=[];let cashTendered=0;
  ['cash','card','bank','payhere'].forEach(x=>{const el=$('#pay_'+x);const v=parseFloat(el&&el.value)||0;
    if(v>0){payments.push({method:x,amount:v});if(x==='cash')cashTendered=v;}});
  let sum=payments.reduce((a,p)=>a+p.amount,0);let change=Math.max(0,sum-c.total);
  const order={id:uid(),no:'C'+(++S.seq.counter),counter:S.session.counter,cashier:S.session.name,type:cart.type,
    items:cart.items.map(i=>({...i})),subtotal:c.sub,discount:c.disc,svc:c.svc,total:c.total,
    payments:payments.map(p=>({...p,amount:Math.min(p.amount,c.total+change-(sum-p.amount)>0?p.amount:p.amount)})),
    change,status:'done',createdAt:nowISO()};
  cart.items.forEach(i=>{const p=S.products.find(x=>x.id===i.id);if(p&&p.minStock!==undefined&&p.stock!==undefined){p.stock=Math.max(0,p.stock-i.qty);
    S.moves.unshift({date:todayISO(),item:p.name,qty:-i.qty,reason:'Sale '+order.no});}});
  order.status='new';
  S.counterOrders.push(order);save();resetCart();closeModal();go('pos');
  showReceipt(order);
}

/* ==================== CATERING ==================== */
function orderTotal(o){
  const items=o.lines.reduce((a,l)=>a+l.rate*(l.perPlate?o.event.guests:l.qty),0);
  const extras=o.extras.reduce((a,l)=>a+l.rate*l.qty,0);
  return items+extras-(o.discount||0);
}
function orderPaid(o){return o.payments.reduce((a,p)=>a+p.amount,0);}
function orderBalance(o){return orderTotal(o)-orderPaid(o);}

  let custId=draft.customerId,custName;

    const c={id:uid(),name:draft.nc.name,phone:draft.nc.phone,email:'',address:draft.nc.address,notes:''};

function renderCal(el){
  const m=new Date(UI.calMonth);const y=m.getFullYear(),mo=m.getMonth();
  const first=new Date(y,mo,1);const startDow=(first.getDay()+6)%7;
  const days=new Date(y,mo+1,0).getDate();
  const cells=[];
  for(let i=0;i<startDow;i++)cells.push(null);
  for(let d=1;d<=days;d++)cells.push(new Date(y,mo,d).toISOString().slice(0,10));
  while(cells.length%7)cells.push(null);
  const evs=d=>S.cateringOrders.filter(o=>o.event.date===d&&o.status!=='Cancelled');
  el.innerHTML=`<div class="page-head"><div><h2>${m.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</h2><div class="sub">Catering event calendar</div></div>
  <div style="display:flex;gap:8px"><button class="btn-ghost btn" onclick="UI.calMonth=new Date(${y},${mo-1},1);render()">◄ Prev</button>
  <button class="btn-ghost btn" onclick="UI.calMonth=new Date();render()">Today</button>
  <button class="btn-ghost btn" onclick="UI.calMonth=new Date(${y},${mo+1},1);render()">Next ►</button></div></div>
  <div class="card"><div class="cal-grid">
  ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
  ${cells.map(d=>d?`<div class="cal-day ${d===todayISO()?'today':''}">
    <div class="dnum">${+d.slice(8)}</div>${evs(d).map(o=>`<div class="cal-ev st${CT_FLOW.indexOf(o.status)}" onclick="go('cateringDetail','${o.id}')">${esc(o.event.title)} (${o.event.guests})</div>`).join('')}</div>`

}

/* ---------- ADMIN REPORTS ---------- */
function reportOrders(){
  const from=UI.rptFrom||dAdd(todayISO(),-6), to=UI.rptTo||todayISO();
  return S.counterOrders.filter(o=>{const d=(o.createdAt||'').slice(0,10);return d>=from&&d<=to;});
}
function renderRpt(el){
  if(!isAdmin()) return el.innerHTML='<div class="card"><h3>Access denied</h3><p>Reports are available to Owner / Admin.</p></div>';
  const orders=reportOrders();
  const revenue=orders.reduce((a,o)=>a+(+o.total||0),0);
  const count=orders.length;
  const avg=count?revenue/count:0;
  const payments={cash:0,card:0,bank:0,payhere:0};
  orders.forEach(o=>(o.payments||[]).forEach(p=>payments[p.method]=(payments[p.method]||0)+(+p.amount||0)));
  const byCounter={};
  orders.forEach(o=>byCounter[o.counter]=(byCounter[o.counter]||0)+(+o.total||0));
  const items={};
  orders.forEach(o=>(o.items||[]).forEach(i=>{
    items[i.name]=(items[i.name]||0)+(+i.qty||0);
  }));
  const topItems=Object.entries(items).sort((a,b)=>b[1]-a[1]).slice(0,10);
  el.innerHTML=`<div class="page-head"><div><h2>Reports</h2><div class="sub">Admin sales, payments, counters and top-selling items</div></div>
    <button class="btn-ghost btn" onclick="window.print()">🖨️ Print Report</button></div>
  <div class="card" style="margin-bottom:14px"><div class="grid" style="grid-template-columns:1fr 1fr auto;align-items:end">
    <div><label>From</label><input type="date" value="${from}" onchange="UI.rptFrom=this.value;render()"></div>
    <div><label>To</label><input type="date" value="${to}" onchange="UI.rptTo=this.value;render()"></div>
    <button class="btn-accent" onclick="UI.rptFrom=dAdd(todayISO(),-6);UI.rptTo=todayISO();render()">Last 7 Days</button>
  </div></div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:14px">
    <div class="card"><small>Sales</small><h2>${fmt(revenue)}</h2><div class="sub">${count} transactions</div></div>
    <div class="card"><small>Average Sale</small><h2>${fmt(avg)}</h2><div class="sub">per transaction</div></div>
    <div class="card"><small>Counter Revenue</small><h2>${Object.keys(byCounter).length}</h2><div class="sub">active counters in report</div></div>
    <div class="card"><small>Catering Orders</small><h2>${S.cateringOrders.filter(o=>o.event.date>=from&&o.event.date<=to).length}</h2><div class="sub">events in period</div></div>
  </div>
  <div class="grid" style="grid-template-columns:1fr 1fr">
    <div class="card"><h3 style="color:var(--primary);margin-bottom:10px">💳 Payment Summary</h3>
      ${Object.entries(payments).map(([m,v])=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)"><span>${m.toUpperCase()}</span><b>${fmt(v)}</b></div>`).join('')}</div>
    <div class="card"><h3 style="color:var(--primary);margin-bottom:10px">🛒 Revenue by Counter</h3>
      ${Object.entries(byCounter).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)"><span>Counter ${c}</span><b>${fmt(v)}</b></div>`).join('')||'<p style="color:var(--muted)">No sales for this period.</p>'}</div>
  </div>
  <div class="card" style="margin-top:14px"><h3 style="color:var(--primary);margin-bottom:10px">🏆 Top Counter Items</h3>
    <div class="tbl-wrap"><table><tr><th>Item</th><th>Qty Sold</th></tr>
    ${topItems.map(([name,qty])=>`<tr><td><b>${esc(name)}</b></td><td>${qty}</td></tr>`).join('')||'<tr><td colspan="2" style="color:var(--muted)">No item sales for this period.</td></tr>'}</table></div></div>`;
}

/* ---------- ADMIN SETTINGS / MENU MANAGEMENT ---------- */
let settingsTab='business';
function renderSettings(el){
  if(!isAdmin()) return el.innerHTML='<div class="card"><h3>Access denied</h3><p>Settings are available to Owner / Admin.</p></div>';
  const tabs=[['business','🏢 Business'],['counterItems','🛒 Counter Items'],['cateringMenu','🍽️ Catering Menu'],['extras','➕ Extras'],['inventory','📦 Inventory'],['recipes','📖 Recipes'],['counters','🖥️ Counters'],['payments','💳 Payments']];
  el.innerHTML=`<div class="page-head"><div><h2>Admin Settings</h2><div class="sub">Manage menus, prices, counter items, counters and business settings</div></div></div>
  <div class="cat-tabs" style="margin-bottom:14px">${tabs.map(([k,l])=>`<button class="cat-tab ${settingsTab===k?'active':''}" onclick="settingsTab='${k}';render()">${l}</button>`).join('')}</div><div id="settings-body"></div>`;
  const b=$('#settings-body');
  if(settingsTab==='business') return renderBusinessSettings(b);
  if(settingsTab==='counterItems') return renderProductManager(b,'counter','Counter Items');
  if(settingsTab==='cateringMenu') return renderProductManager(b,'catering','Catering Menu');
  if(settingsTab==='extras') return renderProductManager(b,'extra','Extras');
  if(settingsTab==='inventory') return renderAdminInventory(b);
  if(settingsTab==='recipes') return renderAdminRecipes(b);
  if(settingsTab==='counters') return renderCounterSettings(b);

}
function renderBusinessSettings(b){

  <div class="grid" style="grid-template-columns:1fr 1fr">

    <div style="grid-column:1/-1"><label>Address</label><input id="bs-address" value="${esc(S.business.address)}"></div>
    <div><label>Email</label><input id="bs-email" value="${esc(S.business.email)}"></div>
    <div><label>TIN</label><input id="bs-tin" value="${esc(S.business.tin||'')}"></div>
    <div><label>Service Charge %</label><input id="bs-service" type="number" min="0" step="0.1" value="${S.business.serviceChargePct||0}"></div>

function saveBusinessSettings(){
  S.business.name=$('#bs-name').value.trim()||S.business.name;
  S.business.phone=$('#bs-phone').value.trim();S.business.address=$('#bs-address').value.trim();S.business.email=$('#bs-email').value.trim();S.business.tin=$('#bs-tin').value.trim();

function productTypeLabel(type){return type==='counter'?'Counter Item':type==='catering'?'Catering Menu':'Extra';}
function renderProductManager(b,type,title){
  const list=S.products.filter(p=>p.type===type);
  b.innerHTML=`<div class="page-head" style="margin-bottom:10px"><div><h3 style="color:var(--primary)">${title}</h3><div class="sub">${list.length} items · Add, edit, price or remove products</div></div><button class="btn-accent" onclick="openProductModal('${type}')">＋ Add ${productTypeLabel(type)}</button></div>
  <div class="card"><div class="tbl-wrap"><table><tr><th>Name</th><th>Category</th><th>Price</th><th>Unit</th>${type==='counter'?'<th>Stock</th>':''}<th>Actions</th></tr>
  ${list.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.cat)}</td><td>${fmt(p.price)}</td><td>${esc(p.unit)}</td>${type==='counter'?`<td>${p.stock===undefined?'∞':p.stock}</td>`:''}<td><button class="btn-ghost btn" onclick="openProductModal('${type}','${p.id}')">✏️ Edit</button> <button class="btn-red" onclick="deleteProduct('${p.id}')">🗑️ Delete</button></td></tr>`).join('')||'<tr><td colspan="6" style="color:var(--muted)">No items yet. Add your first item.</td></tr>'}</table></div></div>`;
}
function openProductModal(type,id){
  const p=id?S.products.find(x=>x.id===id):null;
  openModal(`<h3>${p?'Edit':'Add'} ${productTypeLabel(type)}</h3>
  <div class="grid" style="grid-template-columns:1fr 1fr">
    <div><label>Name</label><input id="pm-name" value="${esc(p?.name||'')}"></div>
    <div><label>Category</label><input id="pm-cat" value="${esc(p?.cat||(type==='counter'?'Short Eats':type==='catering'?'Main Menu':'Extras'))}"></div>
    <div><label>Price (Rs)</label><input id="pm-price" type="number" min="0" step="0.01" value="${p?.price??''}"></div>
    <div><label>Unit</label><input id="pm-unit" value="${esc(p?.unit||(type==='catering'?'per plate':'each'))}"></div>
    ${type==='counter'?`<div><label>Opening Stock</label><input id="pm-stock" type="number" min="0" value="${p?.stock??0}"></div><div><label>Minimum Stock</label><input id="pm-min" type="number" min="0" value="${p?.minStock??0}"></div>`:''}
    ${type==='catering'?`<div><label>Recipe Enabled</label><select id="pm-recipe"><option value="0">No</option><option value="1" ${p?.recipe?'selected':''}>Yes</option></select></div>`:''}
  </div><button class="btn-accent" style="width:100%;padding:13px;margin-top:14px" onclick="saveProduct('${type}','${id||''}')">💾 Save Item</button>`);
  mTitle(p?'Edit Menu Item':'Add Menu Item');
}
function saveProduct(type,id){
  const name=$('#pm-name').value.trim();const cat=$('#pm-cat').value.trim()||'General';const price=Math.max(0,parseFloat($('#pm-price').value)||0);const unit=$('#pm-unit').value.trim()||'each';
  if(!name)return toast('Enter an item name',true);if(price<=0)return toast('Enter a valid price',true);
  let p=id?S.products.find(x=>x.id===id):null;
  if(!p){p={id:uid(),name,cat,price,type,unit};S.products.push(p);}else{Object.assign(p,{name,cat,price,unit});}
  if(type==='counter'){p.stock=Math.max(0,parseFloat($('#pm-stock').value)||0);p.minStock=Math.max(0,parseFloat($('#pm-min').value)||0);}
  if(type==='catering')p.recipe=$('#pm-recipe').value==='1';
  save();closeModal();render();toast(id?'Item updated':'New item added');
}
function deleteProduct(id){
  const p=S.products.find(x=>x.id===id);if(!p)return;
  if(!confirm('Delete '+p.name+'? This removes it from the POS/menu.'))return;
  S.products=S.products.filter(x=>x.id!==id);if(S.recipes)delete S.recipes[id];save();render();toast('Item deleted');
}
function renderAdminInventory(b){
  const list=S.inventory||[];
  b.innerHTML=`<div class="page-head" style="margin-bottom:10px"><div><h3 style="color:var(--primary)">Inventory Items</h3><div class="sub">Add, edit, delete ingredients and control stock levels/costs.</div></div><button class="btn-accent" onclick="openInventoryModal()">＋ Add Ingredient</button></div>
  <div class="card"><div class="tbl-wrap"><table><tr><th>Ingredient</th><th>Unit</th><th>Stock</th><th>Minimum</th><th>Cost</th><th>Value</th><th>Actions</th></tr>
  ${list.map(i=>`<tr><td><b>${esc(i.name)}</b></td><td>${esc(i.unit)}</td><td>${i.stock}</td><td>${i.minStock}</td><td>${fmt(i.cost)}</td><td>${fmt(i.stock*i.cost)}</td><td><button class="btn-ghost btn" onclick="openInventoryModal('${i.id}')">✏️ Edit</button> <button class="btn-red" onclick="deleteInventory('${i.id}')">🗑️ Delete</button></td></tr>`).join('')||'<tr><td colspan="7" style="color:var(--muted)">No ingredients yet.</td></tr>'}</table></div></div>`;
}
function openInventoryModal(id){
  const i=id?S.inventory.find(x=>x.id===id):null;
  openModal(`<h3>${i?'Edit':'Add'} Ingredient</h3><div class="grid" style="grid-template-columns:1fr 1fr">
    <div><label>Ingredient Name</label><input id="im-name" value="${esc(i?.name||'')}"></div>
    <div><label>Unit</label><input id="im-unit" value="${esc(i?.unit||'kg')}"></div>
    <div><label>Current Stock</label><input id="im-stock" type="number" min="0" step="0.01" value="${i?.stock??0}"></div>
    <div><label>Minimum Stock</label><input id="im-min" type="number" min="0" step="0.01" value="${i?.minStock??0}"></div>
    <div><label>Unit Cost (Rs)</label><input id="im-cost" type="number" min="0" step="0.01" value="${i?.cost??0}"></div>
  </div><button class="btn-accent" style="width:100%;padding:13px;margin-top:14px" onclick="saveInventory('${id||''}')">💾 Save Ingredient</button>`);
  mTitle(i?'Edit Ingredient':'Add Ingredient');
}
function saveInventory(id){
  const name=$('#im-name').value.trim(),unit=$('#im-unit').value.trim()||'kg';
  if(!name)return toast('Enter an ingredient name',true);
  const data={name,unit,stock:Math.max(0,parseFloat($('#im-stock').value)||0),minStock:Math.max(0,parseFloat($('#im-min').value)||0),cost:Math.max(0,parseFloat($('#im-cost').value)||0)};
  let i=id?S.inventory.find(x=>x.id===id):null;
  if(i) Object.assign(i,data); else {S.inventory.push({id:uid(),...data});}
  save();closeModal();render();toast(id?'Ingredient updated':'Ingredient added');
}
function deleteInventory(id){
  const i=S.inventory.find(x=>x.id===id);if(!i)return;
  if(!confirm('Delete '+i.name+'? Recipes using this ingredient will also lose that ingredient.'))return;
  S.inventory=S.inventory.filter(x=>x.id!==id);
  Object.keys(S.recipes||{}).forEach(pid=>{S.recipes[pid]=(S.recipes[pid]||[]).filter(([iid])=>iid!==id);});
  save();render();toast('Ingredient deleted');
}
function renderAdminRecipes(b){
  const rows=Object.entries(S.recipes||{}).filter(([pid])=>S.products.some(p=>p.id===pid&&p.type==='catering'));
  b.innerHTML=`<div class="page-head" style="margin-bottom:10px"><div><h3 style="color:var(--primary)">Recipe Management</h3><div class="sub">Change recipes, ingredients, quantities and cost per plate.</div></div><button class="btn-accent" onclick="openRecipeModal()">＋ Create Recipe</button></div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
  ${rows.map(([pid,ings])=>{const p=S.products.find(x=>x.id===pid);const cost=(ings||[]).reduce((a,[iid,q])=>a+q*(S.inventory.find(i=>i.id===iid)?.cost||0),0);return `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><div><h4 style="color:var(--primary)">${esc(p.name)}</h4><small class="sub">${(ings||[]).length} ingredients · Cost/plate ${fmt(cost)}</small></div><div style="display:flex;gap:6px"><button class="btn-ghost btn" onclick="openRecipeModal('${pid}')">✏️ Edit</button><button class="btn-red" onclick="deleteRecipe('${pid}')">🗑️</button></div></div><table style="margin-top:10px">${(ings||[]).map(([iid,q])=>{const i=S.inventory.find(x=>x.id===iid);return `<tr><td>${esc(i?.name||'Deleted ingredient')}</td><td style="text-align:right">${q} ${esc(i?.unit||'')}</td></tr>`}).join('')||'<tr><td style="color:var(--muted)">No ingredients</td></tr>'}</table></div>`}).join('')||'<div class="card"><p>No recipes yet. Create one from a catering menu item.</p></div>'}
  </div>`;
}
function openRecipeModal(pid){
  const catering=S.products.filter(p=>p.type==='catering');
  const p=pid?S.products.find(x=>x.id===pid):null;
  const existing=pid?(S.recipes[pid]||[]):[];
  openModal(`<h3>${p?'Edit':'Create'} Recipe</h3>
    <div><label>Catering Menu Item</label><select id="rm-product" ${p?'disabled':''}>${catering.map(x=>`<option value="${x.id}" ${x.id===pid?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
    <div id="recipe-lines" style="margin-top:12px"></div>
    <button class="btn-ghost btn" style="margin-top:10px" onclick="addRecipeLine()">＋ Add Ingredient</button>
    <button class="btn-accent" style="width:100%;padding:13px;margin-top:14px" onclick="saveRecipe('${pid||''}')">💾 Save Recipe</button>`);
  mTitle(p?'Edit Recipe':'Create Recipe');
  window._recipeDraft=existing.map(([iid,q])=>({iid,q}));

function renderRecipeLines(){
  const el=$('#recipe-lines');if(!el)return;
  const inv=S.inventory||[];
  el.innerHTML=(window._recipeDraft||[]).map((r,idx)=>`<div class="grid" style="grid-template-columns:1fr 120px 42px;align-items:end;margin-bottom:8px"><div><label>Ingredient</label><select onchange="_recipeDraft[${idx}].iid=this.value">${inv.map(i=>`<option value="${i.id}" ${i.id===r.iid?'selected':''}>${esc(i.name)}</option>`).join('')}</select></div><div><label>Qty</label><input type="number" min="0" step="0.001" value="${r.q}" onchange="_recipeDraft[${idx}].q=parseFloat(this.value)||0"></div><button class="btn-red" onclick="_recipeDraft.splice(${idx},1);renderRecipeLines()">×</button></div>`).join('')||'<p style="color:var(--muted)">No ingredients added yet.</p>';

function addRecipeLine(){
  if(!S.inventory.length)return toast('Add inventory ingredients first',true);
  window._recipeDraft=window._recipeDraft||[];window._recipeDraft.push({iid:S.inventory[0].id,q:0.1});renderRecipeLines();
}
function saveRecipe(oldPid){
  const pid=oldPid||$('#rm-product').value;if(!pid)return toast('Select a catering item',true);
  const lines=(window._recipeDraft||[]).filter(r=>r.iid&&r.q>0).map(r=>[r.iid,r.q]);
  if(!lines.length)return toast('Add at least one ingredient',true);
  S.recipes=S.recipes||{};S.recipes[pid]=lines;
  const p=S.products.find(x=>x.id===pid);if(p)p.recipe=true;
  save();closeModal();render();toast('Recipe saved');
}
function deleteRecipe(pid){if(!isAdmin())return;if(!confirm('Delete this recipe?'))return;delete S.recipes[pid];const p=S.products.find(x=>x.id===pid);if(p)p.recipe=false;save();render();toast('Recipe deleted');}
function renderCounterSettings(b){

function saveCounterCount(){S.business.counters=Math.min(20,Math.max(1,parseInt($('#counter-count').value)||1));save();refreshLoginCounters();render();toast('Counter settings saved');}
function refreshLoginCounters(){
  const el=$('#counter-pick');if(!el)return;const n=Math.min(20,Math.max(1,parseInt(S.business.counters)||1));
  el.innerHTML=Array.from({length:n},(_,i)=>`<button type="button" class="${pickCounter===i+1?'sel':''}" onclick="selectCounter(${i+1}, this)">C${i+1}</button>`).join('');
  if(pickCounter>n)pickCounter=1;
}
function renderPaymentSettings(b){
  b.innerHTML=`<div class="card"><h3 style="color:var(--primary);margin-bottom:12px">Payment Methods</h3><div class="grid" style="grid-template-columns:1fr 1fr">
    ${[['cash','💵 Cash'],['card','💳 Card'],['bank','🏦 Bank Transfer'],['payhere','🌐 PayHere']].map(([k,l])=>`<label style="display:flex;align-items:center;gap:10px"><input type="checkbox" id="pmeth-${k}" ${S.business.methods[k]?'checked':''} style="width:auto"> ${l}</label>`).join('')}
    <div><label>PayHere Merchant ID</label><input id="ph-mid" value="${esc(S.business.payhere?.merchantId||'')}"></div>
    <div><label>PayHere Secret</label><input id="ph-secret" type="password" value="${esc(S.business.payhere?.secret||'')}"></div>
  </div><button class="btn-accent" style="margin-top:14px" onclick="savePaymentSettings()">💾 Save Payment Settings</button></div>`;
}
function savePaymentSettings(){
  ['cash','card','bank','payhere'].forEach(k=>S.business.methods[k]=$('#pmeth-'+k).checked);
  S.business.payhere=S.business.payhere||{};S.business.payhere.merchantId=$('#ph-mid').value.trim();S.business.payhere.secret=$('#ph-secret').value;
  save();toast('Payment settings saved');
}
window.addEventListener('DOMContentLoaded',()=>{refreshLoginCounters();});
</script>
</body>
</html>
